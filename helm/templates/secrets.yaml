apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mabi-ah-discord.fullname" . }}
  labels:
    {{- include "mabi-ah-discord.labels" . | nindent 4 }}
  annotations:
    # Keep the credentials around if the release is ever uninstalled
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $val := .Values.env }}
  {{- if $val }}
  {{ $key }}: {{ $val | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
